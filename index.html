aside::after{display:none}
.nav{background:none;border:0;color:#cfe0ff;text-align:left;padding:11px 12px;border-radius:10px;cursor:pointer;display:flex;gap:10px}
.nav.on,.nav:hover{background:var(--b);color:#fff}
main{margin-left:210px;padding:16px 22px 30px}
.top{display:flex;gap:12px;align-items:center;margin-bottom:16px}.top .inp{margin:0;flex:1}
.user{display:flex;gap:8px;align-items:center;font-size:13px}.av{width:34px;height:34px;border-radius:50%;background:var(--a);display:grid;place-items:center;color:#222;font-weight:700}
.hero{border-radius:16px;padding:22px;display:flex;gap:16px;justify-content:space-between;flex-wrap:wrap;align-items:center}
.hero h2{margin:0 0 6px}.tot{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);border-radius:14px;padding:14px 20px;min-width:230px}
.tot b{font-size:26px;display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-top:16px}
.q{background:var(--card);border-radius:14px;padding:18px;text-align:center;cursor:pointer;border:1px solid var(--bd);font-weight:600}
.q:hover{border-color:var(--b);transform:translateY(-2px)}.q span{display:grid;place-items:center;width:48px;height:48px;border-radius:12px;background:var(--b);margin:0 auto 8px;font-size:22px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-top:16px}
h3{margin:0 0 10px}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:9px 6px;border-bottom:1px solid var(--bd);text-align:left}
.wrap{overflow-x:auto}
.pos{display:grid;grid-template-columns:1fr 340px;gap:16px}
.prods{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.pr{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;cursor:pointer}
.pr:hover{border-color:var(--b)}.pr small{color:var(--m)}.pr b{color:var(--b);display:block;margin-top:4px}
.row{display:flex;justify-content:space-between;align-items:center;gap:6px;margin:6px 0;font-size:14px}
.qty button{width:26px;height:26px;border-radius:7px;border:1px solid var(--bd);background:var(--card);color:var(--t);cursor:pointer}
.low{color:#d97706;font-weight:600}.ok{color:#16a34a}
.foot{text-align:center;color:var(--m);font-size:12px;margin-top:24px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--p);color:#fff;padding:10px 18px;border-radius:99px;display:none;z-index:20}
.mb{display:none}
@media(max-width:820px){aside{inset:auto 0 0 0;width:auto;flex-direction:row;padding:6px;justify-content:space-around;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px))}
aside .br{display:none}aside::after{display:none}.nav{flex-direction:column;align-items:center;font-size:10px;padding:6px;gap:2px}
main{margin-left:0;padding:12px 12px 90px}.pos{grid-template-columns:1fr}.user span{display:none}}
.hero.pat{background:#F1F5FC}
.top{background:var(--card);padding:10px 14px;border-radius:14px;box-shadow:0 2px 10px rgba(11,45,145,.08)}.top .inp{border-radius:99px;background:var(--bg)}
.av{background:linear-gradient(135deg,var(--b),var(--p));color:#fff}
.tot{display:flex;gap:14px;align-items:flex-end;justify-content:space-between;background:rgba(30,115,235,.35)}
.tot b{margin:4px 0}.bd{background:#16a34a;color:#fff;border-radius:99px;padding:2px 10px;font-size:12px}
.q{box-shadow:0 4px 14px rgba(11,45,145,.1);border:0;font-size:13px;line-height:1.3}.q span{box-shadow:0 4px 10px rgba(30,115,235,.35);color:#fff}
.nav{align-items:center}.foot{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px}
.nav.on{background:#3b8bff}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.fg .f small{display:block;color:var(--m);font-size:12px;font-weight:600}.fg .f .inp{margin:4px 0 0}.fg .wide{grid-column:1/-1}.exp3{display:grid;grid-template-columns:1fr 1.6fr 1.2fr;gap:6px}.exp3 .inp{padding:11px 6px}
.struk{font-family:"Courier New",monospace;font-size:12.5px;line-height:1.5;color:#000;background:#fff;padding:18px 16px 22px;width:300px;max-width:100%;box-sizing:border-box}.struk .dash{border:0;border-top:1px dashed #000;margin:9px 0}.paper{display:flex;justify-content:center;margin:12px 0;filter:drop-shadow(0 3px 8px rgba(0,0,0,.3))}.paper .struk{-webkit-mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/12px 100%;mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/12px 100%;padding-bottom:30px}
#prt{display:none}
@media print{@page{size:80mm auto;margin:3mm}html,body{background:#fff!important}body>*:not(#prt){display:none!important}#prt{display:block!important}#prt .struk{width:100%;padding:0;-webkit-mask:none;mask:none}}

/* ===== Tema biru-hitam modern, kontras teks diperjelas ===== */
:root{--p:#07152f;--b:#1769e8;--l:#7dd3fc;--a:#ffc857;--bg:#0a1224;--card:#111d36;--t:#edf4ff;--m:#b5c3dc;--bd:#2b3d60}
body{background:radial-gradient(ellipse at 12% 0%,rgba(23,105,232,.18),transparent 42%),var(--bg);color:var(--t)}
.pat{background:linear-gradient(135deg,#07152f 0%,#0b2450 48%,#101827 100%)}
#login.pat{position:relative;isolation:isolate;overflow:hidden;background:radial-gradient(circle at 18% 18%,rgba(42,135,255,.38),transparent 30%),radial-gradient(circle at 88% 78%,rgba(0,210,255,.16),transparent 28%),linear-gradient(135deg,#050b18 0%,#0b1d3e 52%,#071225 100%)}
#login.pat:before,#login.pat:after{content:"";position:absolute;z-index:-1;border:1px solid rgba(125,211,252,.18);border-radius:50%;pointer-events:none}
#login.pat:before{width:340px;height:340px;right:-120px;top:-120px;box-shadow:0 0 0 28px rgba(23,105,232,.045),0 0 0 58px rgba(23,105,232,.035)}
#login.pat:after{width:250px;height:250px;left:-120px;bottom:-90px;box-shadow:0 0 0 25px rgba(125,211,252,.04),0 0 0 55px rgba(125,211,252,.025)}
#login .box{position:relative;width:min(100%,380px);padding:30px 27px;background:linear-gradient(145deg,rgba(20,39,75,.96),rgba(9,19,39,.96));border:1px solid rgba(125,211,252,.3);border-radius:26px;box-shadow:0 24px 70px rgba(0,0,0,.42),inset 0 1px 0 rgba(255,255,255,.08);backdrop-filter:blur(14px)}
#login h2{color:#fff;font-size:26px;letter-spacing:.2px;margin:12px 0 5px!important}
#login .box>div:not(.logo):not(.pill){color:#c6d7f2}
#login .logo{position:relative;display:flex;align-items:center;justify-content:center;width:92px;height:92px;border-radius:26px;margin:0 auto 14px;background:linear-gradient(145deg,#2386ff,#0b3c9e)!important;box-shadow:0 12px 30px rgba(15,105,232,.4),inset 0 1px 0 rgba(255,255,255,.35);border:1px solid rgba(255,255,255,.35);background-image:none!important}
#login .logo:before{content:"";width:48px;height:38px;position:absolute;top:25px;border-radius:5px 5px 8px 8px;background:linear-gradient(180deg,#fff,#dbeafe);clip-path:polygon(0 18%,50% 0,100% 18%,100% 100%,0 100%)}
#login .logo:after{content:"";position:absolute;top:42px;width:15px;height:21px;border-radius:3px 3px 0 0;background:#1769e8;box-shadow:-16px -2px 0 -3px #1769e8,16px -2px 0 -3px #1769e8}
#login .pill{background:rgba(23,105,232,.22);border:1px solid rgba(125,211,252,.35);color:#dff2ff;padding:7px 17px;margin:12px 0 14px}
#login .inp{background:#08142a!important;color:#f5f9ff!important;border:1px solid #334b73!important;border-radius:12px;padding:13px 14px;margin:7px 0;box-shadow:inset 0 1px 3px rgba(0,0,0,.18)}
#login .inp::placeholder{color:#9fb2d1;opacity:1}
#login .inp:focus{outline:2px solid rgba(56,151,255,.55);border-color:#5aa9ff!important}
#login .btn{background:linear-gradient(100deg,#1674f5,#1550bd)!important;border:1px solid #70baff!important;box-shadow:0 8px 20px rgba(13,94,215,.32);padding:13px 18px;border-radius:12px}
#login>p{color:#a9c6ef;text-shadow:0 2px 12px rgba(0,0,0,.45)}
.hero.pat{background:linear-gradient(120deg,#0a1d42,#145ac4)!important;color:#fff}
/* Kartu dan kolom tetap punya kontras jelas pada tema gelap */
.card,.top{background:var(--card);color:var(--t);border:1px solid rgba(125,160,210,.12)}
.inp, input, select{color:var(--t)}
.inp::placeholder,input::placeholder{color:#8fa2c2;opacity:1}
.btn.o{color:#bcdcff;border-color:#4c79bb}


/* PERBAIKAN LOGO: seluruh logo lama diganti ikon toko yang konsisten */
.logo{
  background:linear-gradient(145deg,#258bff,#071b42)!important;
  background-image:none!important;
  position:relative!important; overflow:hidden;
}
#login .logo:before{
  content:""; position:absolute; top:25px; left:21px; width:48px; height:38px;
  border-radius:4px 4px 5px 5px; background:linear-gradient(180deg,#f8fbff 0 20%,#dbeafe 20% 100%);
  clip-path:polygon(14% 0,86% 0,100% 28%,100% 100%,0 100%,0 28%);
}
#login .logo:after{
  content:""; position:absolute; top:36px; left:19px; width:52px; height:12px;
  border-radius:3px 3px 2px 2px;
  background:repeating-linear-gradient(90deg,#ffffff 0 9px,#60a5fa 9px 17px);
  box-shadow:0 4px 0 rgba(8,42,105,.18);
}
#login .logo{isolation:isolate}
#login .logo:before{z-index:0}
#login .logo:after{z-index:1}
/* Logo toko di sidebar, bukan gambar/logo lama */
aside .br i{
  display:block; flex:0 0 36px; width:36px; height:36px; position:relative;
  border-radius:10px!important; overflow:hidden;
  background:linear-gradient(145deg,#258bff,#071b42)!important;
  background-image:none!important; box-shadow:0 5px 14px rgba(0,0,0,.22);
}
aside .br i:before{
  content:""; position:absolute; left:8px; top:12px; width:20px; height:16px;
  border-radius:2px 2px 3px 3px; background:linear-gradient(180deg,#fff,#dbeafe);
  clip-path:polygon(14% 0,86% 0,100% 28%,100% 100%,0 100%,0 28%);
}
aside .br i:after{
  content:""; position:absolute; left:7px; top:9px; width:22px; height:6px;
  border-radius:2px; background:repeating-linear-gradient(90deg,#fff 0 5px,#60a5fa 5px 11px);

/* ===== Responsif: otomatis menyesuaikan layar PC/laptop, tablet, dan HP ===== */
html{-webkit-text-size-adjust:100%}
body{min-height:100vh;min-height:100dvh;overflow-x:hidden}
img,canvas,video,svg{max-width:100%}
#login{min-height:100vh;min-height:100dvh}
#app{min-height:100vh;min-height:100dvh}
#toast{z-index:60;max-width:90vw;text-align:center}
#rd video{max-height:60vh;object-fit:cover}
#rd{overflow:hidden;border-radius:12px}
.wrap table{min-width:520px}
.top{flex-wrap:wrap}
.top .inp{min-width:160px}
.user{flex-shrink:0}
/* Layar besar: isi dibatasi supaya tidak terlalu melebar */
@media(min-width:1500px){main{max-width:1500px;margin-left:max(210px,calc((100vw - 1500px)/2 + 210px));margin-right:auto}}
/* Laptop kecil / tablet landscape */
@media(min-width:821px) and (max-width:1100px){.pos{grid-template-columns:1fr 300px}aside{width:190px}main{margin-left:190px;padding:14px 16px 28px}}
/* Tablet & HP: menu pindah ke bawah */
@media(max-width:820px){
 main{padding:12px 12px calc(86px + env(safe-area-inset-bottom,0px))}
 aside{overflow-x:auto;gap:2px}
 .nav{flex:1 1 0;min-width:56px;justify-content:center;text-align:center}
 .top{padding:8px 10px;gap:8px}
 .top .inp{flex:1 1 100%;order:2}
 .user{margin-left:auto;order:1}
 .hero{padding:16px}.hero h2{font-size:20px}
 .tot{min-width:0;width:100%}
 .card{padding:14px}
 #toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
 .pos{grid-template-columns:1fr}
}
/* HP */
@media(max-width:600px){
 .inp,input,select,textarea{font-size:16px}
 .grid{grid-template-columns:repeat(2,1fr);gap:10px}
 .prods{grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
 .fg{grid-template-columns:1fr}
 table{font-size:13px}th,td{padding:8px 5px}
 .btn{padding:10px 14px}
 .foot{justify-content:center;text-align:center}
 .exp3{grid-template-columns:1fr 1.5fr 1.1fr}
 #login{padding:14px}#login .box{padding:24px 18px}
 #mdl,#camov{padding:10px!important}
 .paper{overflow-x:auto}
}
/* HP kecil */
@media(max-width:380px){.nav{font-size:9px;min-width:48px}.grid{gap:8px}.q{padding:12px}.hero h2{font-size:18px}}
/* HP posisi landscape: tinggi layar pendek */
@media(max-height:480px) and (orientation:landscape){#login{justify-content:flex-start}#rd video{max-height:50vh}}

/* ===== Responsif HP (semua ukuran: HP kecil 320px s/d HP besar/lipat, portrait & landscape) ===== */
*{-webkit-tap-highlight-color:transparent}
button,.nav,.pr,.q,.btn,select,label{touch-action:manipulation}
main,#view,.card,.pos>*,.hero>*,.tot>*,.row>*,.f,.fg>*{min-width:0}
.card,.row,.hero,h2,h3,td,th,small,.toast{overflow-wrap:anywhere}
.grid{grid-template-columns:repeat(auto-fit,minmax(min(100%,140px),1fr))}
.prods{grid-template-columns:repeat(auto-fill,minmax(min(100%,120px),1fr))}
.fg{grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr))}
.hero h2{font-size:clamp(18px,5.4vw,24px)}
.tot b{font-size:clamp(20px,6vw,26px)}
@media(pointer:coarse){.btn,.nav{min-height:44px}.qty button{width:36px;height:36px;font-size:18px}input[type=checkbox]{min-width:18px;min-height:18px}}
@media(max-width:820px){
 aside{width:auto!important;inset:auto 0 0 0!important}
 main{margin-left:0!important;width:100%;max-width:100%}
 main{padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
 aside{display:grid!important;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:2px;overflow:hidden;padding-left:max(6px,env(safe-area-inset-left,0px));padding-right:max(6px,env(safe-area-inset-right,0px))}
 .nav{min-width:0;min-height:48px;padding:6px 2px;font-size:clamp(8.5px,2.5vw,11px);line-height:1.1;text-align:center;white-space:normal;word-break:break-word;justify-content:center}
 .nav svg{flex:0 0 auto}
 .user small{display:none}
}
@media(max-width:480px){
 .card div[style*="display:flex"]{flex-wrap:wrap}
 .card div[style*="display:flex"]>.inp{min-width:140px!important}
 .card div[style*="display:flex"]>.btn{flex:1 1 auto}
 .row{font-size:13px}
 h3{font-size:16px}
 .btn{padding:10px 12px}
 .top .user .btn{padding:8px 10px}
 .foot{font-size:11px}
 #mdlc,#camov .card{width:100%;max-width:100%!important;padding:14px}
 .paper{margin:8px 0}
 #login .box{width:100%}
}
@media(max-width:340px){
 .exp3{grid-template-columns:1fr 1fr}.exp3 select:last-child{grid-column:1/-1}
 .grid{grid-template-columns:1fr 1fr}
 .hero{padding:12px}.card{padding:10px}
 table{font-size:12px}
}
@media(max-height:480px) and (orientation:landscape) and (max-width:900px){
 aside{padding-top:3px;padding-bottom:calc(3px + env(safe-area-inset-bottom,0px))}
 .nav{min-height:38px;flex-direction:row;gap:4px;font-size:11px}
 main{padding-bottom:calc(60px + env(safe-area-inset-bottom,0px))}
 #toast{bottom:calc(60px + env(safe-area-inset-bottom,0px))}
}

function trxItems(t){if(t.items&&t.items.length)return t.items.map(i=>({n:i.n,q:+i.q||1,h:+i.h||0}));if(!t.it||t.it==='Data awal')return[];return t.it.split(', ').map(x=>{const m=x.match(/^(.*) x(\d+)$/);return m?{n:m[1],q:+m[2],h:0}:null}).filter(Boolean)}
function salesStats(){const sold={},pair={};S.trx.forEach(t=>{const it=trxItems(t);it.forEach(i=>{const o=sold[i.n]||(sold[i.n]={n:i.n,q:0});o.q+=i.q});const nm=[...new Set(it.map(i=>i.n))].sort();for(let a=0;a<nm.length;a++)for(let b=a+1;b<nm.length;b++){const k=nm[a]+'\u0001'+nm[b];pair[k]=(pair[k]||0)+1}});return{top:Object.values(sold).sort((a,b)=>b.q-a.q),pairs:Object.entries(pair).map(([k,c])=>{const z=k.split('\u0001');return{a:z[0],b:z[1],c}}).sort((x,y)=>y.c-x.c)}}

let AC,last={c:'',t:0},H5,NV=null,CM='sell';
const fp=c=>String(c).replace(/^0+/,'');
const VOL_TIK=0.8; /* volume bunyi bip scanner kasir: 80% */
function beep(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume();const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=5200;o.type='square';o.frequency.value=2500;g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(VOL_TIK,t+.004);g.gain.setValueAtTime(VOL_TIK,t+.105);g.gain.linearRampToValueAtTime(.0001,t+.12);o.connect(f);f.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+.13)}catch(e){}try{navigator.vibrate&&navigator.vibrate(40)}catch(e){}}
['click','touchstart','keydown'].forEach(ev=>document.addEventListener(ev,()=>{try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume()}catch(e){}},{once:true}));
/* src='kbd' = alat scanner/ketik: barang yang sama boleh discan berurutan. Kamera diberi jeda agar tidak terbaca dobel */
function okScan(c,src){const n=Date.now();if(!c)return false;if(src!=='kbd'&&(n-last.t<700||(c===last.c&&n-last.t<2500)))return false;last={c,t:n};beep();return true}
function scanIn(code,m,src){code=String(code).trim();if(!okScan(code,src))return;onCode(code,m)}

 if(m=='sell'){const p=S.prods.find(x=>x.b&&fp(x.b)==fp(code));if(!p){if(document.getElementById('camov').style.display==='block'){if(msg)msg.textContent='⚠ Barcode '+code+' belum terdaftar';toast('Barcode '+code+' belum terdaftar');return}go('prod');setTimeout(()=>{const pb=document.getElementById('pb');if(pb){pb.value=code;document.getElementById('pn').focus()}},50);toast('Barcode '+code+' belum terdaftar, isi data produk baru');return}add(p.id);if(msg)msg.textContent='✔ '+p.n+' ditambahkan · '+S.cart.reduce((a,c)=>a+c.q,0)+' item di keranjang. Scan barang berikutnya atau tekan Tutup.'}
 else if(m=='cek'){const p=S.prods.find(x=>x.b&&fp(x.b)==fp(code));S.ck=p?{id:p.id}:{nf:code};const r=document.getElementById('ckr');if(r)r.innerHTML=ckHTML()}
 else{const o=S.prods.find(x=>x.b&&fp(x.b)==fp(code));if(o){toast('Barcode sudah terdaftar: '+o.n);return}const pb=document.getElementById('pb');if(!pb)return;pb.value=code;document.getElementById('pn').focus();toast('Barcode: '+code)}}

/* --- bayar pakai QRIS --- */
function cartTot(){const sub=S.cart.reduce((a,c)=>a+c.h*c.q,0);return sub}
function payQ(){if(!S.cart.length)return toast('Keranjang kosong');if(!CU.qris)return toast('QRIS belum ditambahkan. Unggah dulu di menu Pengaturan.');
 openMdl(`<h3 style="text-align:center;margin-top:0">Pembayaran QRIS</h3><div style="text-align:center"><small>Total yang harus dibayar</small><div style="font-size:28px;font-weight:700;margin:4px 0 10px">${rp(cartTot())}</div><img src="${CU.qris}" alt="QRIS" style="width:100%;max-width:300px;background:#fff;border-radius:12px;padding:8px"><p style="font-size:12px;color:var(--m)">Pelanggan scan QRIS ini, lalu masukkan nominal sesuai total di atas.</p></div><div style="display:flex;gap:8px"><button class="btn" style="flex:1" onclick="doneQ()">✔ Pembayaran Diterima</button><button class="btn o" onclick="closeMdl()">Batal</button></div>`)}
function doneQ(){if(!S.cart.length){closeMdl();return}const tot=cartTot();S.cart.forEach(c=>S.prods.find(p=>p.id==c.id).s-=c.q);const r=mkTrx('QRIS',tot,tot);S.cart=[];S.useQ=false;closeMdl();render();showStruk(r)}
/* ===== Gambar barcode EAN-13 (untuk dicetak / dites dari layar) ===== */
const EL=['0001101','0011001','0010011','0111101','0100011','0110001','0101111','0111011','0110111','0001011'],EG=['0100111','0110011','0011011','0100001','0011101','0111001','0000101','0010001','0001001','0010111'],ER=['1110010','1100110','1101100','1000010','1011100','1001110','1010000','1000100','1001000','1110100'],EP=['LLLLLL','LLGLGG','LLGGLG','LLGGGL','LGLLGG','LGGLLG','LGGGLL','LGLLGL','LGLGLG','LGGLGL'];
EP[7]='LGLGLG';EP[8]='LGLGGL';EP[9]='LGGLGL';
function ean13ok(c){if(!/^\d{13}$/.test(c))return false;let t=0;for(let i=0;i<12;i++)t+=+c[i]*(i%2?3:1);return (10-t%10)%10==+c[12]}
function bc(c,h=42){c=String(c);if(!ean13ok(c))return `<span style="font-size:12px">${c}</span>`;let b='101';const pr=EP[+c[0]];for(let i=1;i<7;i++)b+=(pr[i-1]=='L'?EL:EG)[+c[i]];b+='01010';for(let i=7;i<13;i++)b+=ER[+c[i]];b+='101';
 let r='',x=9;for(let i=0;i<b.length;){if(b[i]=='1'){let j=i;while(b[j]=='1')j++;r+=`<rect x="${x+i}" y="2" width="${j-i}" height="${h}"/>`;i=j}else i++}
 return `<svg viewBox="0 0 113 ${h+14}" width="120" style="background:#fff;border-radius:4px;display:block"><g fill="#000">${r}</g><text x="56.5" y="${h+11}" font-size="9" text-anchor="middle" font-family="monospace" fill="#000">${c}</text></svg>`}
function genEAN(){let d;do{d='899'+String(Math.floor(Math.random()*1e9)).padStart(9,'0');let t=0;for(let i=0;i<12;i++)t+=+d[i]*(i%2?3:1);d+=(10-t%10)%10}while(S.prods.some(p=>p.b==d));const pb=document.getElementById('pb');if(pb){pb.value=d;toast('Barcode dibuat: '+d)}}
window.addEventListener('load',startWithoutLogin,{once:true});
